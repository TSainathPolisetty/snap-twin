# Brio 101 camera intrinsics
# NOTE: These were calibrated at 640x480 and scaled non-uniformly to 1920x1080.
# Recalibrating at native 1920x1080 would improve solvePnP accuracy.
image_width: 1920
image_height: 1080
camera_name: brio
camera_matrix:
  rows: 3
  cols: 3
  data: [2905.5, 0.0, 1201.3,
         0.0, 2168.2, 582.7,
         0.0, 0.0, 1.0]
distortion_model: plumb_bob
distortion_coefficients:
  rows: 1
  cols: 5
  data: [0.210, -0.102, 0.010, 0.041, 0.0]
