name: snap-twin
base: core22
version: "1.0"
summary: SO-101 dual-arm gesture demo with Gengar detection
description: |
  ROS2 Humble demo for Jetson Orin NX: leader/follower SO-101 arms,
  overhead Gengar detection, depth inference with TensorRT, Foxglove
  visualization. Requires JetPack 6.x on the target device.

grade: devel
confinement: devmode

plugs:
  # TODO: Serial ports aren't deterministic -- how do we handle this?
  serial-port-leader:
    interface: serial-port
    path: /dev/ttyACM1

  serial-port-follower:
    interface: serial-port
    path: /dev/ttyACM0

  graphics-core22:
    interface: content
    target: $SNAP/graphics
    default-provider: mesa-core22

  system-files-tegra:
    interface: system-files
    read:
      - /usr/lib/aarch64-linux-gnu/tegra
      - /usr/lib/python3/dist-packages/tensorrt
      - /usr/src/tensorrt/bin

layout:
  /usr/share/libdrm:
    bind: $SNAP/graphics/libdrm

  /usr/share/drirc.d:
    symlink: $SNAP/graphics/drirc.d

  /usr/share/X11/XErrorDB:
    symlink: $SNAP/graphics/X11/XErrorDB

  /usr/share/X11/locale:
    symlink: $SNAP/graphics/X11/locale

apps:
  demo:
    command: bin/start_demo.sh
    # XXX: This extension is experimental!
    extensions: [ros2-humble-ros-base]
    command-chain:
      - bin/graphics-core22-wrapper
    plugs:
      - camera
      - serial-port-leader
      - serial-port-follower
      - opengl
      - wayland
      - graphics-core22
      - hardware-observe
      - system-files-tegra
      - home
      - network
      - network-bind
    environment:
      # XXX: This might be a problem... something something SNAP_LIBRARY_PATH
      LD_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu/tegra:$SNAP/graphics/lib:$LD_LIBRARY_PATH
      PYTHONPATH: /usr/lib/python3/dist-packages:$PYTHONPATH
      SNAP_TWIN_DATA_DIR: $SNAP_COMMON
      WAYLAND_DISPLAY: wayland-0
      QT_QPA_PLATFORM: wayland
      GDK_BACKEND: wayland
      DISPLAY: ""

  foxglove-bridge:
    command: bin/foxglove-wrapper
    extensions: [ros2-humble-ros-base]
    plugs:
      - network
      - network-bind
    daemon: simple
    restart-condition: on-failure

  asset-server:
    command: bin/asset_server.sh
    plugs:
      - network-bind
    daemon: simple
    restart-condition: on-failure

parts:
  so101-ros2:
    plugin: colcon
    # XXX: this is evil - not anymore -I hope
    source: .
    source-subdir: ros/so101_ros2
    colcon-cmake-args:
      - -DCMAKE_BUILD_TYPE=Release
    build-packages:
      - python3-pip
      - python3-dev
    override-build: |
      pip3 install yourdfpy scipy PyYAML pycuda
      craftctl default
    after:
      - onnx-model

  onnx-model:
    plugin: nil
    source: .
    build-packages:
      - python3-pip
    override-build: |
      bash scripts/download_model.sh
      mkdir -p $SNAPCRAFT_PART_INSTALL/models
      mv models/depth_anything_v2_small.onnx \
        $SNAPCRAFT_PART_INSTALL/models/depth_anything_v2_small.onnx

  share-assets:
    plugin: dump
    source: share/

  foxglove-bridge-bin:
    plugin: nil
    stage-snaps:
      - foxglove-bridge/humble/stable
    stage:
      - opt/ros/snap/lib/foxglove_bridge/foxglove_bridge
      - opt/ros/snap/lib/*.so*
      - opt/ros/humble/lib/*.so*
    organize:
      opt/ros/snap/lib/foxglove_bridge/foxglove_bridge: bin/foxglove_bridge

  scripts:
    plugin: dump
    source: scripts/
    organize:
      "*": bin/

  graphics-core22:
    after:
      - so101-ros2
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: | 
      craftctl default
      ${CRAFT_PART_SRC}/bin/graphics-core22-cleanup mesa-core22 nvidia-core22
    prime:
      - bin/graphics-core22-wrapper
