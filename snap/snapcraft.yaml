  foxglove-bridge-bin:
    plugin: nil
    stage-snaps:
      - foxglove-bridge
    stage:
      - opt/ros/snap/lib/foxglove_bridge/foxglove_bridge
      - opt/ros/snap/lib/*.so*
      - opt/ros/humble/lib/*.so*
    organize:
      opt/ros/snap/lib/foxglove_bridge/foxglove_bridge: bin/foxglove_bridge

  share:
    plugin: dump
    source: share/
    organize:
      "*": usr/share/snap-twin/

  scripts:
    plugin: dump
    source: scripts/
    organize:
