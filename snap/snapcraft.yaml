name: snap-twin
base: core22
version: "1.0"
summary: SO-101 dual-arm gesture demo with Gengar detection
description: |
  ROS2 Humble demo for Jetson Orin NX: leader/follower SO-101 arms,
  overhead Gengar detection, depth inference with TensorRT, Foxglove
  visualization. Requires JetPack 6.x on the target device.
  Display served as MJPEG stream on port 8081 — point wpe-webkit-mir-kiosk
  or any browser at http://localhost:8081/stream.

grade: devel
confinement: strict

hooks:
  install:
    plugs: [network-observe]

layout:
  /usr/lib/aarch64-linux-gnu/nvidia:
    bind: $SNAP/usr/lib/tegra

apps:
  demo:
    command: bin/start_demo.sh
    extensions: [ros2-humble-ros-base]
    plugs:
      - camera
      - opengl
      - hardware-observe
      - home
      - network
      - network-bind
      - wayland
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/tegra:$LD_LIBRARY_PATH
      # GStreamer plugin discovery — staged plugins must be found at runtime
      GST_PLUGIN_PATH: $SNAP/usr/lib/aarch64-linux-gnu/gstreamer-1.0
      GST_PLUGIN_SCANNER: $SNAP/usr/lib/aarch64-linux-gnu/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner
      # Explicit PYTHONPATH override: the extension's own PYTHONPATH is replaced when
      # the app sets this, so we must include everything we need in one entry:
      #   1. snap private pip site-packages → numpy 1.26.4, pycuda, deepdiff, tqdm, yourdfpy
      #      (put first so numpy 1.26.4 wins over apt's old numpy 1.21.5 in dist-packages)
      #   2. snap-staged dist-packages      → cv2 and apt-staged Python packages
      #   3. content snap dist-packages     → lark, packaging, netifaces (ros2launch deps)
      #   4. host python3.10 dist-pkgs      → tensorrt, pycuda (via system-files-tegra)
      #   5. host python3 dist-pkgs         → scipy, yaml fallback
      PYTHONPATH: $SNAP/usr/lib/python3.10/site-packages:$SNAP/usr/lib/python3/dist-packages:$SNAP/opt/ros/underlay_ws/usr/lib/python3/dist-packages:/usr/lib/python3.10/dist-packages:/usr/lib/python3/dist-packages:$PYTHONPATH

      SNAP_TWIN_DATA_DIR: $SNAP_COMMON

  asset-server:
    command: bin/asset_server.sh
    plugs:
      - network-bind
    daemon: simple
    restart-condition: on-failure

parts:
  so101-ros2:
    plugin: colcon
    # XXX: this is evil - not anymore -I hope
    source: .
    source-subdir: ros/so101_ros2
    colcon-cmake-args:
      - -DCMAKE_BUILD_TYPE=Release
    build-packages:
      - python3-pip
      - python3-dev
    stage-packages:
      - python3-opencv
      - gstreamer1.0-plugins-good   # provides v4l2src (needed for 1920×1080 camera pipeline)
    override-build: |
      export CPATH="/usr/local/cuda/include:${CPATH:-}"
      export LIBRARY_PATH="/usr/local/cuda/lib64:${LIBRARY_PATH:-}"

      # Keep pip-installed Python packages separate from apt/stage-packages.
      # python3-opencv pulls Ubuntu's old numpy 1.21.5 into dist-packages, but
      # pycuda 2026.x requires numpy ≥ 1.22 (uses np.dtype[Any] generic syntax).
      # Install pip packages into a private site-packages dir and put that first
      # in PYTHONPATH so numpy 1.26.4 wins at runtime.
      PIPDEST="$SNAPCRAFT_PART_INSTALL/usr/lib/python3.10/site-packages"
      mkdir -p "$PIPDEST"

      pip3 install \
        --target="$PIPDEST" \
        --ignore-installed \
        --no-cache-dir \
        "numpy==1.26.4" \
        yourdfpy pycuda deepdiff pyserial tqdm

      # scservo_sdk: vendored Feetech servo SDK (not on PyPI, lives in repo)
      cp -r "$SNAPCRAFT_PART_SRC/vendor/scservo_sdk" \
        "$PIPDEST/scservo_sdk"

      # tensorrt: JetPack Python bindings at a host path that isn't reliably
      # visible inside the snap; copy them in explicitly (destructive-mode only)
      for pkg in tensorrt tensorrt_lean tensorrt_dispatch; do
        if [ -d "/usr/lib/python3.10/dist-packages/$pkg" ]; then
          cp -r "/usr/lib/python3.10/dist-packages/$pkg" \
            "$PIPDEST/$pkg"
        else
          echo "WARNING: /usr/lib/python3.10/dist-packages/$pkg not found"
        fi
      done

      # Stage NVIDIA TensorRT runtime .so files from host.
      # CRITICAL: system-files plug only adjusts AppArmor policy — it does NOT
      # make host paths visible in the snap's mount namespace. Files at
      # /lib/aarch64-linux-gnu/libnvinfer* are invisible inside the snap at
      # runtime. We must copy them in at build time (destructive-mode only,
      # build host == install target on this Orin NX).
      NVDEST="$SNAPCRAFT_PART_INSTALL/usr/lib/tegra"
      mkdir -p "$NVDEST"

      # TRT core libs (versioned .so files + .so.10 / .so symlinks)
      for base in libnvinfer libnvinfer_plugin libnvonnxparser \
                  libnvinfer_lean libnvinfer_dispatch \
                  libnvinfer_vc_plugin libnvinfer_builder_resource; do
        src="/usr/lib/aarch64-linux-gnu/${base}.so.10.3.0"
        if [ -f "$src" ]; then
          cp "$src" "$NVDEST/"
          ln -sf "${base}.so.10.3.0" "$NVDEST/${base}.so.10"
          ln -sf "${base}.so.10"     "$NVDEST/${base}.so"
        else
          echo "WARNING: $src not found — TRT will fail at runtime"
        fi
      done

      # libnvcudla (no version suffix)
      cp /usr/lib/aarch64-linux-gnu/libnvcudla.so "$NVDEST/" 2>/dev/null || \
        echo "WARNING: libnvcudla.so not found"

      # libcuda — actual file lives in nvidia/ subdir; create canonical symlinks
      cp /usr/lib/aarch64-linux-gnu/nvidia/libcuda.so.1.1 "$NVDEST/"
      ln -sf libcuda.so.1.1 "$NVDEST/libcuda.so.1"
      ln -sf libcuda.so.1   "$NVDEST/libcuda.so"

      # libcuda dlopen()s libnvcucompat.so during cuInit on JetPack 6.x.
      # Host LD_DEBUG shows it resolving from /lib/aarch64-linux-gnu/libnvcucompat.so.
      # Important: /lib/aarch64-linux-gnu/libnvcucompat.so may itself be a symlink,
      # so resolve it and copy the real file into the snap.
      for src in \
        /lib/aarch64-linux-gnu/libnvcucompat.so \
        /usr/lib/aarch64-linux-gnu/libnvcucompat.so \
        /usr/lib/aarch64-linux-gnu/nvidia/libnvcucompat.so; do
        if [ -e "$src" ]; then
          real_src="$(readlink -f "$src")"
          echo "Staging libnvcucompat.so from $src -> $real_src"
          rm -f "$NVDEST/libnvcucompat.so"
          install -Dm644 "$real_src" "$NVDEST/libnvcucompat.so"
          break
        fi
      done

      [ -f "$NVDEST/libnvcucompat.so" ] || \
        echo "WARNING: libnvcucompat.so not found — cuInit may fail with 999"

      # libcudla from CUDA toolkit (TRT transitive dep)
      if [ -f /usr/local/cuda-12.6/lib64/libcudla.so.1 ]; then
        cp /usr/local/cuda-12.6/lib64/libcudla.so.1 "$NVDEST/"
      else
        echo "WARNING: libcudla.so.1 not found"
      fi

      # libcurand (pycuda dep)
      if [ -f /usr/local/cuda-12.6/lib64/libcurand.so.10 ]; then
        cp /usr/local/cuda-12.6/lib64/libcurand.so.10 "$NVDEST/"
      else
        echo "WARNING: libcurand.so.10 not found"
      fi

      # Tegra kernel-interface support libs (libcuda/TRT transitive deps)
      for lib in libnvos.so libnvrm_chip.so libnvrm_gpu.so libnvrm_host1x.so \
                 libnvrm_mem.so libnvrm_sync.so libnvsciipc.so libnvsocsys.so \
                 libnvtegrahv.so libnvdla_compiler.so libnvdla_runtime.so; do
        src="/usr/lib/aarch64-linux-gnu/nvidia/$lib"
        if [ -f "$src" ]; then
          cp "$src" "$NVDEST/"
        else
          echo "WARNING: $src not found"
        fi
      done

      craftctl default
    after:
      - onnx-model

  onnx-model:
    plugin: nil
    source: .
    build-packages:
      - python3-pip
    # NOTE: This part runs trtexec at build time. It requires JetPack 6.x
    # with trtexec at /usr/src/tensorrt/bin/ on the BUILD machine itself.
    # This is valid here because we build with --destructive-mode directly
    # on the same Orin NX that runs the demo — build host == install target.
    override-build: |
      bash scripts/download_model.sh

      mkdir -p "$SNAPCRAFT_PART_INSTALL/models"
      mv models/depth_anything_v2_small.onnx \
        "$SNAPCRAFT_PART_INSTALL/models/depth_anything_v2_small.onnx"

      export LD_LIBRARY_PATH="/usr/lib/aarch64-linux-gnu/tegra:${LD_LIBRARY_PATH:-}"

      /usr/src/tensorrt/bin/trtexec \
        --onnx="$SNAPCRAFT_PART_INSTALL/models/depth_anything_v2_small.onnx" \
        --saveEngine="$SNAPCRAFT_PART_INSTALL/models/depth_anything_v2_small.engine" \
        --fp16 \
        --minShapes=pixel_values:1x3x518x518 \
        --optShapes=pixel_values:1x3x518x518 \
        --maxShapes=pixel_values:1x3x518x518 \
        2>&1 | tee "$SNAPCRAFT_PART_INSTALL/models/conversion.log"

  share-assets:
    plugin: dump
    source: share/

  scripts:
    plugin: dump
    source: scripts/
    organize:
      "*": bin/
