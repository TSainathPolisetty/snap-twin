name: snap-twin
base: core22
version: "1.0"
summary: SO-101 dual-arm gesture demo with Gengar detection
description: |
  ROS2 Humble demo for Jetson Orin NX: leader/follower SO-101 arms,
  overhead Gengar detection, depth inference with TensorRT, Foxglove
  visualization. Requires JetPack 6.x on the target device.

grade: devel
confinement: devmode

plugs:
  # TODO: Serial ports aren't deterministic -- how do we handle this?
  serial-port-leader:
    interface: serial-port
    path: /dev/ttyACM1

  serial-port-follower:
    interface: serial-port
    path: /dev/ttyACM0

  graphics-core22:
    interface: content
    target: $SNAP/graphics
    default-provider: mesa-core22

  system-files-tegra:
    interface: system-files
    read:
      - /usr/lib/aarch64-linux-gnu/tegra
      - /usr/lib/python3/dist-packages/tensorrt
      - /usr/src/tensorrt/bin

apps:
  demo:
    command: bin/start_demo.sh
    # XXX: This extension is experimental!
    extensions: [ros2-humble-ros-base]
    plugs:
      - camera
      - serial-port-leader
      - serial-port-follower
      - opengl
      - wayland
      - graphics-core22
      - hardware-observe
      - system-files-tegra
      - home
      - network
      - network-bind
    environment:
      # XXX: This might be a problem... something something SNAP_LIBRARY_PATH
      LD_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu/tegra:$SNAP/graphics/lib:$LD_LIBRARY_PATH
      PYTHONPATH: /usr/lib/python3/dist-packages:$PYTHONPATH
      SNAP_TWIN_DATA_DIR: $SNAP_COMMON
      WAYLAND_DISPLAY: wayland-0
      QT_QPA_PLATFORM: wayland
      GDK_BACKEND: wayland
      DISPLAY: ""

  foxglove-bridge:
    command: bin/foxglove-wrapper
    extensions: [ros2-humble-ros-base]
    plugs:
      - network
      - network-bind
    daemon: simple
    restart-condition: on-failure

  asset-server:
    command: bin/asset_server.sh
    plugs:
      - network-bind
    daemon: simple
    restart-condition: on-failure

parts:
  so101-ros2:
    plugin: colcon
    # XXX: this is evil
    source: so101_ros2
    colcon-packages:
      - so101_ros2
    colcon-cmake-args:
      - -DCMAKE_BUILD_TYPE=Release
    build-packages:
      - python3-colcon-common-extensions
    after:
      - pip-deps
      # - onnx-model

