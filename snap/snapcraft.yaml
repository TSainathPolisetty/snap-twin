name: snap-twin
base: core22
version: "1.0"
summary: SO-101 dual-arm gesture demo with Gengar detection
description: |
  ROS2 Humble demo for Jetson Orin NX: leader/follower SO-101 arms,
  overhead Gengar detection, depth inference with TensorRT, Foxglove
  visualization. Requires JetPack 6.x on the target device.

grade: devel
confinement: strict

plugs:
  # TODO: Serial ports aren't deterministic -- how do we handle this?
  serial-port-leader:
    interface: serial-port
    path: /dev/ttyACM1

  serial-port-follower:
    interface: serial-port
    path: /dev/ttyACM0

  graphics-core22:
    interface: content
    target: $SNAP/graphics
    default-provider: mesa-core22

  system-files-tegra:
    interface: system-files
    read:
      - /usr/lib/aarch64-linux-gnu/tegra
      - /usr/lib/aarch64-linux-gnu
      - /usr/lib/python3.10/dist-packages/tensorrt
      - /usr/lib/python3.10/dist-packages/cv2

layout:
  /usr/share/libdrm:
    bind: $SNAP/graphics/libdrm

  /usr/share/drirc.d:
    symlink: $SNAP/graphics/drirc.d

  /usr/share/X11/XErrorDB:
    symlink: $SNAP/graphics/X11/XErrorDB

  /usr/share/X11/locale:
    symlink: $SNAP/graphics/X11/locale

apps:
  demo:
    command: bin/start_demo.sh
    # XXX: This extension is experimental!
    extensions: [ros2-humble-ros-base]
    command-chain:
      - bin/graphics-core22-wrapper
    plugs:
      - camera
      - serial-port-leader
      - serial-port-follower
      - opengl
      - wayland
      - x11
      - graphics-core22
      - hardware-observe
      - system-files-tegra
      - home
      - network
      - network-bind
    environment:
      LD_LIBRARY_PATH: /usr/local/cuda-12.6/lib64:/usr/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu/tegra:$SNAP/graphics/lib:$LD_LIBRARY_PATH
      # Explicit PYTHONPATH override: the extension's own PYTHONPATH is replaced when
      # the app sets this, so we must include everything we need in one entry:
      #   1. snap-staged pip packages    → deepdiff, pyserial, tqdm, yourdfpy, cv2
      #   2. content snap dist-packages  → lark, packaging, netifaces (ros2launch deps)
      #   3. host python3.10 dist-pkgs   → tensorrt, pycuda (via system-files-tegra)
      #   4. host python3 dist-pkgs      → scipy, yaml fallback
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/opt/ros/underlay_ws/usr/lib/python3/dist-packages:/usr/lib/python3.10/dist-packages:/usr/lib/python3/dist-packages:$PYTHONPATH
      SNAP_TWIN_DATA_DIR: $SNAP_COMMON
      WAYLAND_DISPLAY: wayland-0
      QT_QPA_PLATFORM: wayland
      # DISPLAY=:0 → ubuntu-frame's XWayland compositor.
      # cv2 GTK backend uses X11 (not Wayland-native), so XWayland is required.
      # Connect with: snap connect snap-twin:x11 ubuntu-frame:x11
      DISPLAY: ":0"

  asset-server:
    command: bin/asset_server.sh
    plugs:
      - network-bind
    daemon: simple
    restart-condition: on-failure

parts:
  so101-ros2:
    plugin: colcon
    # XXX: this is evil - not anymore -I hope
    source: .
    source-subdir: ros/so101_ros2
    colcon-cmake-args:
      - -DCMAKE_BUILD_TYPE=Release
    build-packages:
      - python3-pip
      - python3-dev
    stage-packages:
      - python3-opencv
    override-build: |
      export CPATH="/usr/local/cuda/include:${CPATH:-}"
      export LIBRARY_PATH="/usr/local/cuda/lib64:${LIBRARY_PATH:-}"
      pip3 install \
        --target="$SNAPCRAFT_PART_INSTALL/usr/lib/python3/dist-packages" \
        --ignore-installed \
        yourdfpy pycuda deepdiff pyserial tqdm

      # scservo_sdk: vendored Feetech servo SDK (not on PyPI, lives in repo)
      cp -r $SNAPCRAFT_PART_SRC/vendor/scservo_sdk \
        "$SNAPCRAFT_PART_INSTALL/usr/lib/python3/dist-packages/scservo_sdk"

      # tensorrt: JetPack Python bindings at a host path that isn't reliably
      # visible inside the snap; copy them in explicitly (destructive-mode only)
      for pkg in tensorrt tensorrt_lean tensorrt_dispatch; do
        if [ -d "/usr/lib/python3.10/dist-packages/$pkg" ]; then
          cp -r "/usr/lib/python3.10/dist-packages/$pkg" \
            "$SNAPCRAFT_PART_INSTALL/usr/lib/python3/dist-packages/$pkg"
        fi
      done

      craftctl default
    after:
      - onnx-model

  onnx-model:
    plugin: nil
    source: .
    build-packages:
      - python3-pip
    # NOTE: This part runs trtexec at build time. It requires JetPack 6.x
    # with trtexec at /usr/src/tensorrt/bin/ on the BUILD machine itself.
    # This is valid here because we build with --destructive-mode directly
    # on the same Orin NX that runs the demo — build host == install target.
    override-build: |
      bash scripts/download_model.sh
      mkdir -p $SNAPCRAFT_PART_INSTALL/models
      mv models/depth_anything_v2_small.onnx \
        $SNAPCRAFT_PART_INSTALL/models/depth_anything_v2_small.onnx

      export LD_LIBRARY_PATH="/usr/lib/aarch64-linux-gnu/tegra:${LD_LIBRARY_PATH:-}"
      /usr/src/tensorrt/bin/trtexec \
        --onnx=$SNAPCRAFT_PART_INSTALL/models/depth_anything_v2_small.onnx \
        --saveEngine=$SNAPCRAFT_PART_INSTALL/models/depth_anything_v2_small.engine \
        --fp16 \
        --minShapes=pixel_values:1x3x518x518 \
        --optShapes=pixel_values:1x3x518x518 \
        --maxShapes=pixel_values:1x3x518x518 \
        2>&1 | tee $SNAPCRAFT_PART_INSTALL/models/conversion.log

  share-assets:
    plugin: dump
    source: share/

  scripts:
    plugin: dump
    source: scripts/
    organize:
      "*": bin/

  graphics-core22:
    after:
      - so101-ros2
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: | 
      craftctl default
      ${CRAFT_PART_SRC}/bin/graphics-core22-cleanup mesa-core22 nvidia-core22
    prime:
      - bin/graphics-core22-wrapper
